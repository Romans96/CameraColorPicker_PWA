<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Camera Color Picker PWA</title>
        <link rel="stylesheet" href="./css/index.css" />
    </head>
    <body>
        <video id="video" autoplay playsinline muted></video>
        
        <div id="crosshair"></div>
        
        <div id="info">
            <div id="colorBox" style="height: 30px; width: 100%; margin-bottom: 10px; border-radius: 5px;"></div>
            <h2 id="colorName">Inizializzazione...</h2>
            <p id="colorHex">#000000</p>
        </div>

        <canvas id="canvas" style="display:none;"></canvas>

        <!-- <script src="./scripts/utils/ntc.js"></script> -->
        
        <script src="./scripts/index.js" type="module"></script>

        <script>
            window.onerror = function(msg, url, line) {
                alert("Errore: " + msg + "\nLinea: " + line);
            };
        </script>
    </body>
</html>
